# TransUNet 3D thu nhỏ cho GPU 4GB: ít kênh, patch 96^3, batch 1 + tích lũy gradient
base: base.yaml
output_dir: runs/transunet3d_small
model:
  name: transunet
  spatial_dims: 3
  features: [16, 32, 64, 128, 256]
  decoder:
    hidden: 96
    num_queries: 20
    layers: 3
    heads: 8
    ffn_mult: 4
    masked_attn: true
    ms_idxs: [-4, -3, -2]
loss:
  cost_weight: [2.0, 5.0, 5.0]
  no_object_weight: 0.1
train:
  patch_size: [96, 96, 96]
  batch_size: 1
  grad_accum: 2
  pool_size: 2
  samples_per_load: 4
  num_workers: 2
  augment: {}
  epochs: 100
eval:
  every: 10
  val_cases: 5
