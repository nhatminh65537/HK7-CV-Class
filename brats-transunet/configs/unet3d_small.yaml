# Baseline 3D: U-Net 3D thu nhỏ (so sánh với transunet3d_small)
base: base.yaml
output_dir: runs/unet3d_small
model:
  name: unet
  spatial_dims: 3
  features: [16, 32, 64, 128, 256]
train:
  patch_size: [96, 96, 96]
  batch_size: 1
  grad_accum: 2
  pool_size: 2
  samples_per_load: 4
  augment: {}
eval:
  every: 10
  val_cases: 5
